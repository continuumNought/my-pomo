[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-pomo"
version = "0.1.0"
description = "A Pomodoro timer with a TUI built using Textual"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["pomodoro", "timer", "tui", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.40.0",
    "pyfiglet>=0.8",
    "playsound3>=2.0",
]

[project.scripts]
my-pomo = "my_pomo.__main__:main"

[project.urls]
Homepage = "https://github.com/yourusername/my-pomo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
my_pomo = ["assets/*.mp3"]
